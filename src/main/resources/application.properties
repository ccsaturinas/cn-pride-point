server.port=2677
server.servlet.context-path=/cnpp
# Database connection
main.datasource.url=jdbc:mysql://localhost/cnpridepoint?useSSL=false&allowMultiQueries=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
main.datasource.username=cnpridepoint
main.datasource.password=cnpridepoint.user
main.liquibase.change-log=com/company/cnpridepoint/liquibase/changelog.xml
jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/company/cnpridepoint/menu.xml
jmix.ui.composite-menu=false
ui.login.defaultUsername=admin
ui.login.defaultPassword=admin
jmix.core.available-locales=en,fr
jmix.core.locale=en
# For Multiple File Storage
jmix.core.default-file-storage=fs
jmix.localfs.storage-dir=/opt/cnpp/filestorage/fs
# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false
logging.level.org.atmosphere=warn
# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info
# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info
# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug
# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info
# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info
# Rest API
#jmix.resource-server.authenticated-url-patterns=/rest/**,/sync-attendance/**
jmix.resource-server.authenticated-url-patterns=/rest/**,/attendance/**
#### myclient1 #################################################################################################
