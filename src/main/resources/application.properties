spring.security.oauth2.authorizationserver.client.myclient1.registration.client-id=rkvzqweokt
spring.security.oauth2.authorizationserver.client.myclient1.registration.client-secret={noop}PueKXdBtII
spring.security.oauth2.authorizationserver.client.myclient1.registration.client-authentication_methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.myclient1.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.myclient1.token.access-token-format=reference
