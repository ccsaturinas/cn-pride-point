###############################################################################################################
#### myclient2 ################################################################################################
# mobile app authenticate as a real Jmix user (START)
spring.security.oauth2.authorizationserver.client.myclient2.registration.client-id=cnpp-local
spring.security.oauth2.authorizationserver.client.myclient2.registration.client-secret={noop}cnpp-local-secret
spring.security.oauth2.authorizationserver.client.myclient2.registration.client-authentication_methods=client_secret_basic
#** enable required grant types
spring.security.oauth2.authorizationserver.client.myclient2.registration.authorization-grant-types=authorization_code,refresh_token
#** use opaque tokens instead of JWT in docs examples
spring.security.oauth2.authorizationserver.client.myclient2.token.access-token-format=reference
spring.security.oauth2.authorizationserver.client.myclient2.token.access-token-time-to-live=1h
spring.security.oauth2.authorizationserver.client.myclient2.token.refresh-token-time-to-live=24h
jmix.authserver.client.myclient2.client-id=cnpp-local
jmix.authserver.client.myclient2.resource-roles=rest-minimal
#** Use a mobile deep link / app link
spring.security.oauth2.authorizationserver.client.myclient2.registration.redirect-uris=http://localhost:2677/cnpp/oauth/callback
#** Use PKCE (important for mobile) when performing the Authorization Code Grant flow
spring.security.oauth2.authorizationserver.client.myclient2.require-proof-key=true
# mobile app authenticate as a real Jmix user (END)
###############################################################################################################
#### cnpp-mobile ################################################################################################
spring.security.oauth2.authorizationserver.client.cnpp-mobile.registration.client-id=cnpp-mobile
spring.security.oauth2.authorizationserver.client.cnpp-mobile.registration.client-secret={noop}cnpp-mobile-secret
spring.security.oauth2.authorizationserver.client.cnpp-mobile.registration.client-authentication_methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.cnpp-mobile.registration.authorization-grant-types=password,refresh_token
spring.security.oauth2.authorizationserver.client.cnpp-mobile.token.access-token-format=reference
spring.security.oauth2.authorizationserver.client.cnpp-mobile.token.access-token-time-to-live=15m
spring.security.oauth2.authorizationserver.client.cnpp-mobile.token.refresh-token-time-to-live=90d
jmix.authserver.client.cnpp-mobile.client-id=cnpp-mobile
jmix.authserver.client.cnpp-mobile.resource-roles=mobile-user-role
